# =====================================================================
#  Base de comparaison des brokers - CHRONYX
#
#  IMPORTANT
#  - Ces informations NE SONT PAS une recommandation d'investissement.
#  - Les conditions changent souvent : chaque ligne porte un statut
#    "verifie" (avec date et source) ou "a_verifier".
#  - Les spreads et commissions ne sont PAS renseignés ici tant qu'ils n'ont
#    pas été relevés : le robot peut les MESURER lui-même sur un compte démo
#    (onglet Brokers > Mesurer les spreads).
#  - Avant toute ouverture de compte, vérifier l'autorisation du prestataire
#    sur REGAFI (https://www.regafi.fr) et la liste noire de l'AMF.
#
#  Règles communes aux entités régulées dans l'UE pour les particuliers
#  (mesures ESMA reprises par l'AMF) :
#    - levier max 1:30 paires majeures, 1:20 or et autres paires ;
#    - protection contre le solde négatif obligatoire ;
#    - clôture des positions à 50 % de niveau de marge ;
#    - avertissement standardisé sur le % de comptes perdants.
# =====================================================================

regles_ue:
  levier_or: 20
  levier_majeures: 30
  solde_negatif_protege: true
  stop_out_marge_pct: 50

sources_officielles:
  - {nom: "REGAFI (registre des agents financiers - France)", url: "https://www.regafi.fr"}
  - {nom: "AMF - listes noires et mises en garde", url: "https://www.amf-france.org/fr/espace-epargnants/proteger-son-epargne/listes-noires-et-mises-en-garde"}
  - {nom: "CySEC - registre des entreprises d'investissement", url: "https://www.cysec.gov.cy/en-GB/entities/investment-firms/"}
  - {nom: "ESMA - registres", url: "https://registers.esma.europa.eu"}

